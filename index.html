<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treetop Tier List — Birder's Edition</title>
<style>
  :root{
    --canopy-dark:#1b2f1a;
    --canopy-mid:#274d2b;
    --canopy-light:#3d6b3f;
    --bark:#4a3423;
    --bark-light:#6b4a30;
    --parchment:#f4ecd8;
    --leaf-shadow:rgba(0,0,0,.35);
    --tier-s:#e0b23e;
    --tier-a:#7ec850;
    --tier-b:#3fb6a8;
    --tier-c:#4d8fd6;
    --tier-d:#a5713f;
    --tier-f:#8a4b3b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.05), transparent 40%),
      radial-gradient(circle at 80% 0%, rgba(255,255,255,.04), transparent 35%),
      linear-gradient(180deg, var(--canopy-dark) 0%, var(--canopy-mid) 45%, var(--bark) 100%);
    color:var(--parchment);
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    text-align:center;
    padding:28px 16px 14px;
    background:linear-gradient(180deg, rgba(0,0,0,.25), transparent);
    border-bottom:3px solid var(--bark-light);
  }
  header h1{
    margin:0 0 6px;
    font-size:2rem;
    letter-spacing:1px;
    text-shadow:0 2px 4px rgba(0,0,0,.5);
  }
  header p{
    margin:0;
    opacity:.85;
    font-size:.95rem;
  }
  .toolbar{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  button{
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-size:.85rem;
    font-weight:600;
    background:var(--bark-light);
    color:var(--parchment);
    box-shadow:0 3px 0 rgba(0,0,0,.3);
    transition:transform .1s ease;
  }
  button:hover{transform:translateY(-2px);}
  button:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.3);}
  #reset-btn{background:#7a3b3b;}
  #export-img-btn{background:#3b6b7a;}
  #export-json-btn{background:#5a5a3b;}

  main{
    max-width:1100px;
    margin:24px auto;
    padding:0 16px;
  }

  .tier-row{
    display:flex;
    min-height:96px;
    margin-bottom:10px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 10px var(--leaf-shadow);
    border:2px solid rgba(0,0,0,.25);
  }
  .tier-label{
    width:90px;
    flex:0 0 90px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6rem;
    font-weight:800;
    color:#1b2f1a;
    text-shadow:0 1px 0 rgba(255,255,255,.25);
  }
  .tier-row[data-tier="S"] .tier-label{background:var(--tier-s);}
  .tier-row[data-tier="A"] .tier-label{background:var(--tier-a);}
  .tier-row[data-tier="B"] .tier-label{background:var(--tier-b);}
  .tier-row[data-tier="C"] .tier-label{background:var(--tier-c);}
  .tier-row[data-tier="D"] .tier-label{background:var(--tier-d);}
  .tier-row[data-tier="F"] .tier-label{background:var(--tier-f);}

  .dropzone{
    flex:1;
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:8px;
    padding:8px;
    background:rgba(0,0,0,.25);
    min-height:96px;
  }
  .dropzone.drag-over{
    background:rgba(255,255,255,.12);
    outline:2px dashed rgba(255,255,255,.5);
    outline-offset:-4px;
  }

  #pool-section{
    margin-top:30px;
    background:rgba(0,0,0,.2);
    border-radius:12px;
    padding:16px;
    border:2px solid rgba(0,0,0,.25);
  }
  #pool-section h2{
    margin:0 0 12px;
    font-size:1.1rem;
    display:flex;
    align-items:center;
    gap:8px;
  }
  #search-input{
    margin-bottom:12px;
    width:100%;
    max-width:260px;
    padding:8px 10px;
    border-radius:6px;
    border:1px solid var(--bark-light);
    background:rgba(255,255,255,.9);
    color:#222;
  }
  #pool{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    min-height:120px;
  }

  .bird-tile{
    width:104px;
    background:var(--parchment);
    color:#2a2a2a;
    border-radius:8px;
    padding:4px;
    text-align:center;
    box-shadow:0 2px 4px rgba(0,0,0,.4);
    cursor:grab;
    user-select:none;
    touch-action:none;
    position:relative;
  }
  .bird-tile.dragging{
    opacity:.35;
  }
  .bird-tile img{
    width:100%;
    height:60px;
    object-fit:cover;
    border-radius:5px;
    background:#ccc;
    display:block;
  }
  .bird-tile .bird-name{
    font-size:.82rem;
    line-height:1.2;
    margin-top:4px;
    font-weight:700;
  }
  .bird-tile .bird-cat{
    font-size:.72rem;
    opacity:.75;
    font-weight:600;
  }

  #drag-ghost{
    position:fixed;
    pointer-events:none;
    z-index:999;
    width:88px;
    opacity:.9;
    transform:translate(-44px,-30px);
  }

  footer{
    text-align:center;
    opacity:.6;
    font-size:.75rem;
    margin-top:30px;
  }

  @media (max-width:600px){
    .tier-label{width:56px;flex:0 0 56px;font-size:1.2rem;}
    .bird-tile{width:88px;}
    .bird-tile img{height:55px;}
    .bird-tile .bird-name{font-size:.72rem;}
    .bird-tile .bird-cat{font-size:.64rem;}
  }
</style>
</head>
<body>

<header>
  <h1>🌳 Treetop Tier List</h1>
  <p>Drag birds from the Bird Bank into a tier to rank them — S is the treetop, F is the forest floor.</p>
  <div class="toolbar">
    <button id="reset-btn">🔄 Reset</button>
    <button id="export-img-btn">📸 Save as Image</button>
    <button id="export-json-btn">💾 Copy Rankings</button>
  </div>
</header>

<main>
  <div id="tier-list">
    <div class="tier-row" data-tier="S">
      <div class="tier-label">S</div>
      <div class="dropzone" data-tier="S"></div>
    </div>
    <div class="tier-row" data-tier="A">
      <div class="tier-label">A</div>
      <div class="dropzone" data-tier="A"></div>
    </div>
    <div class="tier-row" data-tier="B">
      <div class="tier-label">B</div>
      <div class="dropzone" data-tier="B"></div>
    </div>
    <div class="tier-row" data-tier="C">
      <div class="tier-label">C</div>
      <div class="dropzone" data-tier="C"></div>
    </div>
    <div class="tier-row" data-tier="D">
      <div class="tier-label">D</div>
      <div class="dropzone" data-tier="D"></div>
    </div>
    <div class="tier-row" data-tier="F">
      <div class="tier-label">F</div>
      <div class="dropzone" data-tier="F"></div>
    </div>
  </div>

  <div id="pool-section">
    <h2>🪺 Bird Bank <span style="font-size:.7rem;opacity:.6;">(drag tiles up into a tier)</span></h2>
    <input type="text" id="search-input" placeholder="Search birds or categories...">
    <div id="pool" class="dropzone" data-tier="pool"></div>
  </div>
</main>

<footer>Images courtesy of Wikipedia. Rankings are saved automatically in your browser.</footer>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
(function(){
  "use strict";

  const STORAGE_KEY = "treetopTierList_v1";
  const TIERS = ["S","A","B","C","D","F"];

  // Placeholder image if fetch fails / offline
  const FALLBACK_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="60" viewBox="0 0 100 60">' +
    '<rect width="100" height="60" fill="#cbb98f"/>' +
    '<text x="50" y="35" font-size="28" text-anchor="middle">🐦</text></svg>'
  );

  const birds = [
    {id:"bald_eagle", name:"Bald Eagle", wiki:"Bald_eagle", cat:"Raptor"},
    {id:"golden_eagle", name:"Golden Eagle", wiki:"Golden_eagle", cat:"Raptor"},
    {id:"peregrine_falcon", name:"Peregrine Falcon", wiki:"Peregrine_falcon", cat:"Raptor"},
    {id:"red_tailed_hawk", name:"Red-tailed Hawk", wiki:"Red-tailed_hawk", cat:"Raptor"},
    {id:"osprey", name:"Osprey", wiki:"Osprey", cat:"Raptor"},
    {id:"harpy_eagle", name:"Harpy Eagle", wiki:"Harpy_eagle", cat:"Raptor"},
    {id:"secretarybird", name:"Secretarybird", wiki:"Secretarybird", cat:"Raptor"},
    {id:"andean_condor", name:"Andean Condor", wiki:"Andean_condor", cat:"Raptor"},
    {id:"king_vulture", name:"King Vulture", wiki:"King_vulture", cat:"Raptor"},

    {id:"snowy_owl", name:"Snowy Owl", wiki:"Snowy_owl", cat:"Owl"},
    {id:"great_horned_owl", name:"Great Horned Owl", wiki:"Great_horned_owl", cat:"Owl"},
    {id:"barn_owl", name:"Barn Owl", wiki:"Barn_owl", cat:"Owl"},
    {id:"great_grey_owl", name:"Great Grey Owl", wiki:"Great_grey_owl", cat:"Owl"},
    {id:"eastern_screech_owl", name:"Eastern Screech Owl", wiki:"Eastern_screech_owl", cat:"Owl"},

    {id:"common_raven", name:"Common Raven", wiki:"Common_raven", cat:"Corvid"},
    {id:"american_crow", name:"American Crow", wiki:"American_crow", cat:"Corvid"},
    {id:"blue_jay", name:"Blue Jay", wiki:"Blue_jay", cat:"Corvid"},
    {id:"eurasian_magpie", name:"Eurasian Magpie", wiki:"Eurasian_magpie", cat:"Corvid"},
    {id:"stellers_jay", name:"Steller's Jay", wiki:"Steller%27s_jay", cat:"Corvid"},

    {id:"mallard", name:"Mallard", wiki:"Mallard", cat:"Waterfowl"},
    {id:"canada_goose", name:"Canada Goose", wiki:"Canada_goose", cat:"Waterfowl"},
    {id:"mute_swan", name:"Mute Swan", wiki:"Mute_swan", cat:"Waterfowl"},
    {id:"wood_duck", name:"Wood Duck", wiki:"Wood_duck", cat:"Waterfowl"},
    {id:"mandarin_duck", name:"Mandarin Duck", wiki:"Mandarin_duck", cat:"Waterfowl"},

    {id:"atlantic_puffin", name:"Atlantic Puffin", wiki:"Atlantic_puffin", cat:"Seabird"},
    {id:"brown_pelican", name:"Brown Pelican", wiki:"Brown_pelican", cat:"Seabird"},
    {id:"royal_albatross", name:"Royal Albatross", wiki:"Royal_albatross", cat:"Seabird"},
    {id:"northern_gannet", name:"Northern Gannet", wiki:"Northern_gannet", cat:"Seabird"},
    {id:"emperor_penguin", name:"Emperor Penguin", wiki:"Emperor_penguin", cat:"Seabird"},

    {id:"scarlet_macaw", name:"Scarlet Macaw", wiki:"Scarlet_macaw", cat:"Exotic"},
    {id:"toco_toucan", name:"Toco Toucan", wiki:"Toco_toucan", cat:"Exotic"},
    {id:"resplendent_quetzal", name:"Resplendent Quetzal", wiki:"Resplendent_quetzal", cat:"Exotic"},
    {id:"indian_peafowl", name:"Indian Peafowl", wiki:"Indian_peafowl", cat:"Exotic"},
    {id:"rainbow_lorikeet", name:"Rainbow Lorikeet", wiki:"Rainbow_lorikeet", cat:"Exotic"},
    {id:"greater_flamingo", name:"Greater Flamingo", wiki:"Greater_flamingo", cat:"Exotic"},
    {id:"victoria_crowned_pigeon", name:"Victoria Crowned Pigeon", wiki:"Victoria_crowned_pigeon", cat:"Exotic"},
    {id:"hyacinth_macaw", name:"Hyacinth Macaw", wiki:"Hyacinth_macaw", cat:"Exotic"},
    {id:"superb_bird_of_paradise", name:"Superb Bird-of-paradise", wiki:"Superb_bird-of-paradise", cat:"Exotic"},

    {id:"ruby_throated_hummingbird", name:"Ruby-throated Hummingbird", wiki:"Ruby-throated_hummingbird", cat:"Hummingbird"},
    {id:"annas_hummingbird", name:"Anna's Hummingbird", wiki:"Anna%27s_hummingbird", cat:"Hummingbird"},
    {id:"sword_billed_hummingbird", name:"Sword-billed Hummingbird", wiki:"Sword-billed_hummingbird", cat:"Hummingbird"},

    {id:"american_robin", name:"American Robin", wiki:"American_robin", cat:"Songbird"},
    {id:"house_sparrow", name:"House Sparrow", wiki:"House_sparrow", cat:"Songbird"},
    {id:"european_robin", name:"European Robin", wiki:"European_robin", cat:"Songbird"},
    {id:"northern_cardinal", name:"Northern Cardinal", wiki:"Northern_cardinal", cat:"Songbird"},
    {id:"black_capped_chickadee", name:"Black-capped Chickadee", wiki:"Black-capped_chickadee", cat:"Songbird"},
    {id:"european_starling", name:"European Starling", wiki:"Common_starling", cat:"Songbird"},
    {id:"barn_swallow", name:"Barn Swallow", wiki:"Barn_swallow", cat:"Songbird"},
    {id:"house_finch", name:"House Finch", wiki:"House_finch", cat:"Songbird"},
    {id:"american_goldfinch", name:"American Goldfinch", wiki:"American_goldfinch", cat:"Songbird"},
    {id:"song_thrush", name:"Song Thrush", wiki:"Song_thrush", cat:"Songbird"},

    {id:"pileated_woodpecker", name:"Pileated Woodpecker", wiki:"Pileated_woodpecker", cat:"Woodpecker"},
    {id:"downy_woodpecker", name:"Downy Woodpecker", wiki:"Downy_woodpecker", cat:"Woodpecker"},
    {id:"northern_flicker", name:"Northern Flicker", wiki:"Northern_flicker", cat:"Woodpecker"},

    {id:"great_blue_heron", name:"Great Blue Heron", wiki:"Great_blue_heron", cat:"Wading Bird"},
    {id:"sandhill_crane", name:"Sandhill Crane", wiki:"Sandhill_crane", cat:"Wading Bird"},
    {id:"american_white_ibis", name:"American White Ibis", wiki:"American_white_ibis", cat:"Wading Bird"},
    {id:"roseate_spoonbill", name:"Roseate Spoonbill", wiki:"Roseate_spoonbill", cat:"Wading Bird"},

    {id:"ostrich", name:"Common Ostrich", wiki:"Common_ostrich", cat:"Flightless"},
    {id:"southern_cassowary", name:"Southern Cassowary", wiki:"Southern_cassowary", cat:"Flightless"},
    {id:"kiwi", name:"Southern Brown Kiwi", wiki:"Southern_brown_kiwi", cat:"Flightless"},

    {id:"wild_turkey", name:"Wild Turkey", wiki:"Wild_turkey", cat:"Game Bird"},
    {id:"ring_necked_pheasant", name:"Ring-necked Pheasant", wiki:"Common_pheasant", cat:"Game Bird"},

    {id:"grey_parrot", name:"Grey Parrot", wiki:"Grey_parrot", cat:"Parrot"},
    {id:"cockatiel", name:"Cockatiel", wiki:"Cockatiel", cat:"Parrot"},

    {id:"common_kingfisher", name:"Common Kingfisher", wiki:"Common_kingfisher", cat:"Kingfisher"},
    {id:"belted_kingfisher", name:"Belted Kingfisher", wiki:"Belted_kingfisher", cat:"Kingfisher"}
  ];

  let state = loadState();

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    const s = {};
    birds.forEach(b => s[b.id] = "pool");
    return s;
  }

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function render(){
    document.querySelectorAll(".dropzone").forEach(z => z.innerHTML = "");
    const zones = {};
    TIERS.forEach(t => zones[t] = document.querySelector('.dropzone[data-tier="'+t+'"]'));
    zones.pool = document.getElementById("pool");

    const filter = document.getElementById("search-input").value.trim().toLowerCase();

    birds.forEach(bird => {
      const tier = state[bird.id] || "pool";
      const zone = zones[tier] || zones.pool;
      const tile = buildTile(bird);
      if(tier === "pool" && filter){
        const match = bird.name.toLowerCase().includes(filter) || bird.cat.toLowerCase().includes(filter);
        tile.style.display = match ? "" : "none";
      }
      zone.appendChild(tile);
    });
  }

  function buildTile(bird){
    const tile = document.createElement("div");
    tile.className = "bird-tile";
    tile.dataset.id = bird.id;
    tile.innerHTML =
      '<img src="' + (bird.img || FALLBACK_IMG) + '" alt="' + bird.name + '" loading="lazy">' +
      '<div class="bird-name">' + bird.name + '</div>' +
      '<div class="bird-cat">' + bird.cat + '</div>';
    attachDrag(tile);
    return tile;
  }

  // --- Pointer-based drag & drop (works for mouse + touch) ---
  let ghost = null;
  let draggedTile = null;

  function attachDrag(tile){
    tile.addEventListener("pointerdown", onPointerDown);
  }

  function onPointerDown(e){
    draggedTile = e.currentTarget;
    draggedTile.setPointerCapture(e.pointerId);
    draggedTile.classList.add("dragging");

    ghost = draggedTile.cloneNode(true);
    ghost.id = "drag-ghost";
    ghost.classList.remove("dragging");
    document.body.appendChild(ghost);
    moveGhost(e.clientX, e.clientY);

    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp, {once:true});
  }

  function moveGhost(x, y){
    if(ghost){
      ghost.style.left = x + "px";
      ghost.style.top = y + "px";
    }
  }

  function onPointerMove(e){
    moveGhost(e.clientX, e.clientY);
    document.querySelectorAll(".dropzone.drag-over").forEach(z => z.classList.remove("drag-over"));
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const zone = el && el.closest(".dropzone");
    if(zone) zone.classList.add("drag-over");
  }

  function onPointerUp(e){
    document.removeEventListener("pointermove", onPointerMove);
    document.querySelectorAll(".dropzone.drag-over").forEach(z => z.classList.remove("drag-over"));

    const el = document.elementFromPoint(e.clientX, e.clientY);
    const zone = el && el.closest(".dropzone");
    if(zone && draggedTile){
      const tier = zone.dataset.tier;
      state[draggedTile.dataset.id] = tier;
      saveState();
    }

    if(ghost){ ghost.remove(); ghost = null; }
    if(draggedTile){ draggedTile.classList.remove("dragging"); }
    draggedTile = null;
    render();
  }

  // --- Load real bird photos from Wikipedia (falls back to placeholder if offline) ---
  async function loadImages(){
    await Promise.all(birds.map(async bird => {
      try{
        const res = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + bird.wiki);
        if(!res.ok) return;
        const data = await res.json();
        if(data.thumbnail && data.thumbnail.source){
          bird.img = data.thumbnail.source;
        }
      }catch(err){ /* keep fallback image */ }
    }));
    render();
  }

  // --- Toolbar actions ---
  document.getElementById("reset-btn").addEventListener("click", () => {
    if(!confirm("Reset all rankings back to the Bird Bank?")) return;
    birds.forEach(b => state[b.id] = "pool");
    saveState();
    render();
  });

  document.getElementById("export-img-btn").addEventListener("click", () => {
    html2canvas(document.getElementById("tier-list"), {backgroundColor:"#1b2f1a"}).then(canvas => {
      const link = document.createElement("a");
      link.download = "treetop-tier-list.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  });

  document.getElementById("export-json-btn").addEventListener("click", () => {
    const grouped = {};
    TIERS.forEach(t => grouped[t] = []);
    birds.forEach(b => {
      const tier = state[b.id];
      if(tier && tier !== "pool") grouped[tier].push(b.name);
    });
    let text = "My Treetop Tier List:\n";
    TIERS.forEach(t => {
      text += t + ": " + (grouped[t].join(", ") || "-") + "\n";
    });
    navigator.clipboard.writeText(text).then(() => {
      alert("Rankings copied to clipboard!");
    }).catch(() => {
      prompt("Copy your rankings:", text);
    });
  });

  document.getElementById("search-input").addEventListener("input", render);

  render();
  loadImages();
})();
</script>

</body>
</html>
